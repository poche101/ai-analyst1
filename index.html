<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Data Analyst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      bg: 'var(--bg)', surface: 'var(--surface)', sunk: 'var(--sunk)', line: 'var(--line)',
      ink: 'var(--ink)', mute: 'var(--mute)', accent: 'var(--accent)', onaccent: 'var(--on-accent)',
      accentsoft: 'var(--accent-soft)', good: 'var(--good)', goodsoft: 'var(--good-soft)',
      warn: 'var(--warn)', warnsoft: 'var(--warn-soft)', bad: 'var(--bad)', badsoft: 'var(--bad-soft)',
      info: 'var(--info)', infosoft: 'var(--info-soft)'
    },
    fontFamily: {
      display: ['"Bricolage Grotesque"', '"IBM Plex Sans"', 'system-ui', 'sans-serif'],
      sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
      mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace']
    }
  } }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

<style>
/* Layout: persistent left rail (workspace / admin switch), slim top bar, scrolling main. Chat is a three-pane working surface. */
:root {
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#EAEEEA; --line:#DCE2DD;
  --ink:#15211D; --mute:#5B6862;
  --accent:#17695C; --on-accent:#FFFFFF; --accent-soft:#DDEEE9;
  --good:#1E7A45; --good-soft:#DDF0E4; --warn:#9A5806; --warn-soft:#F8EBD0;
  --bad:#B3321F; --bad-soft:#F8DFDA; --info:#2F5FA8; --info-soft:#DFE8F5;
  --c1:#17695C; --c2:#2F5FA8; --c3:#B0690B; --c4:#6B5AA6; --c5:#B3321F;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0E1513; --surface:#151E1B; --sunk:#0B100F; --line:#26332E;
    --ink:#E6EEEA; --mute:#94A39C;
    --accent:#4DB8A3; --on-accent:#07201B; --accent-soft:#163029;
    --good:#5FC48A; --good-soft:#14301F; --warn:#E0A44A; --warn-soft:#33270F;
    --bad:#EE7C69; --bad-soft:#381A15; --info:#7FA8E8; --info-soft:#172640;
    --c1:#4DB8A3; --c2:#7FA8E8; --c3:#E0A44A; --c4:#A996E0; --c5:#EE7C69;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0E1513; --surface:#151E1B; --sunk:#0B100F; --line:#26332E;
  --ink:#E6EEEA; --mute:#94A39C;
  --accent:#4DB8A3; --on-accent:#07201B; --accent-soft:#163029;
  --good:#5FC48A; --good-soft:#14301F; --warn:#E0A44A; --warn-soft:#33270F;
  --bad:#EE7C69; --bad-soft:#381A15; --info:#7FA8E8; --info-soft:#172640;
  --c1:#4DB8A3; --c2:#7FA8E8; --c3:#E0A44A; --c4:#A996E0; --c5:#EE7C69;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.i { display: inline-block; width: 1.125rem; height: 1.125rem; flex: none; }
.i svg { width: 100%; height: 100%; display: block; }
.num { font-variant-numeric: tabular-nums; }
.kw { color: var(--info); font-weight: 500; } .str { color: var(--good); } .cm { color: var(--mute); }
[x-cloak] { display: none !important; }
.scroll-thin::-webkit-scrollbar { height: 8px; width: 8px; } .scroll-thin::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
@keyframes blink { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
.dot { animation: blink 1.2s infinite; } .dot:nth-child(2){ animation-delay:.15s } .dot:nth-child(3){ animation-delay:.3s }
@keyframes rise { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform:none } }
.rise { animation: rise .25s ease-out both; }
@keyframes phIn { to { opacity: 1; transform: none; } }
.ph-word { opacity: 0; transform: translateY(5px); animation: phIn .38s cubic-bezier(.2,.7,.2,1) forwards; }
@media (prefers-reduced-motion: reduce) { .dot, .rise { animation: none; } .ph-word { animation: none; opacity: 1; transform: none; } * { transition: none !important; } }
</style>
<style type="text/tailwindcss">
@layer components {
  .btn { @apply inline-flex items-center justify-center gap-2 h-9 px-3 rounded-md border border-line bg-surface text-ink text-[13px] font-medium whitespace-nowrap hover:bg-sunk focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:opacity-50 disabled:pointer-events-none; }
  .btn-primary { @apply bg-accent text-onaccent border-transparent hover:bg-accent hover:opacity-90; }
  .btn-sm { @apply h-8 px-2.5 text-xs; }
  .btn-danger { @apply text-bad; }
  .btn-ghost { @apply border-transparent bg-transparent hover:bg-sunk; }
  .card { @apply bg-surface border border-line rounded-[10px]; }
  .input { @apply h-9 w-full rounded-md border border-line bg-surface px-3 text-[13px] text-ink placeholder:text-mute focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent; }
  .lbl { @apply block text-xs font-medium text-mute mb-1; }
  .pill { @apply inline-flex items-center gap-1.5 h-5 px-2 rounded-full text-[11px] font-medium whitespace-nowrap; }
  .p-good { @apply bg-goodsoft text-good; } .p-warn { @apply bg-warnsoft text-warn; } .p-bad { @apply bg-badsoft text-bad; }
  .p-info { @apply bg-infosoft text-info; } .p-mute { @apply bg-sunk text-mute; }
  .th { @apply text-left text-[11px] font-medium uppercase tracking-wider text-mute px-3 py-2 border-b border-line whitespace-nowrap bg-sunk; }
  .td { @apply px-3 py-2.5 border-b border-line align-middle; }
  .h1 { @apply font-display text-[26px] leading-tight font-semibold tracking-tight; }
  .h2 { @apply font-display text-[17px] font-semibold tracking-tight; }
  .eyebrow { @apply text-[11px] font-medium uppercase tracking-[0.08em] text-mute; }
  .nav { @apply flex items-center gap-2.5 h-9 px-2.5 rounded-md text-[13px] font-medium text-mute hover:bg-sunk hover:text-ink w-full text-left focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent; }
  .nav-on { @apply bg-accentsoft text-accent hover:bg-accentsoft hover:text-accent; }
  .tab { @apply h-9 px-3 text-[13px] font-medium text-mute border-b-2 border-transparent hover:text-ink; }
  .tab-on { @apply text-ink border-accent; }
  .chip { @apply inline-flex items-center gap-1.5 h-8 px-3 rounded-full border border-line bg-surface text-xs text-ink hover:bg-sunk text-left; }
}
</style>

<div x-data="app()" x-cloak class="h-full flex bg-bg text-ink">

  <div x-show="nav" @click="nav=false" class="fixed inset-0 z-30 lg:hidden" style="background:rgba(8,14,12,.5)"></div>

  <!-- ============ SIDEBAR ============ -->
  <aside :class="nav ? 'translate-x-0' : '-translate-x-full'" class="fixed lg:static inset-y-0 left-0 z-40 w-[264px] max-w-[86vw] shrink-0 flex flex-col bg-surface border-r border-line transition-transform lg:translate-x-0" style="padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)">
    <div class="h-14 flex items-center gap-2.5 border-b border-line" style="padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px">
      <svg viewBox="0 0 32 32" class="w-7 h-7 shrink-0" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 21l6-6 4 4 8-9" fill="none" stroke="var(--on-accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25" cy="10" r="2.4" fill="var(--on-accent)"/></svg>
      <div class="leading-tight"><div class="font-display font-semibold text-[15px]">AI Data Analyst</div><div class="text-[11px] text-mute">Working name</div></div>
    </div>

    <div class="p-3" style="padding-left:max(12px,env(safe-area-inset-left,0px))">
      <div class="grid grid-cols-2 p-0.5 rounded-md bg-sunk text-xs font-medium" role="tablist" aria-label="Area">
        <button role="tab" :aria-selected="!admin" @click="go('home')" :class="!admin ? 'bg-surface text-ink shadow-sm' : 'text-mute'" class="h-8 rounded">Workspace</button>
        <button role="tab" :aria-selected="admin" @click="go('admin-overview')" :class="admin ? 'bg-surface text-ink shadow-sm' : 'text-mute'" class="h-8 rounded">Admin</button>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto scroll-thin px-3 pb-3 flex flex-col gap-0.5" style="padding-left:max(12px,env(safe-area-inset-left,0px))" aria-label="Main">
      <template x-for="n in items" :key="n.k">
        <button class="nav" :class="view===n.k && 'nav-on'" @click="go(n.k)" :aria-current="view===n.k ? 'page' : null">
          <i class="i" x-ic="n.i"></i><span x-text="n.l"></span>
          <span x-show="n.badge" class="ml-auto pill p-bad num" x-text="n.badge"></span>
        </button>
      </template>

      <template x-if="!admin">
        <div class="mt-5">
          <div class="eyebrow px-2.5 mb-1.5">Recent analyses</div>
          <template x-for="h in history.slice(0,4)" :key="h.t">
            <button class="nav h-auto py-1.5 font-normal" @click="go('chat')"><span class="truncate" x-text="h.t"></span></button>
          </template>
        </div>
      </template>
      <template x-if="admin">
        <div class="mt-5 mx-0.5 p-3 rounded-lg bg-sunk text-xs text-mute leading-relaxed">
          <div class="flex items-center gap-1.5 text-ink font-medium mb-1"><i class="i !w-4 !h-4" x-ic="'lock'"></i>Signed in as super admin</div>
          MFA verified 41 min ago. Session expires in 3 h 19 min. Every action on these screens is written to the audit log.
        </div>
      </template>
    </nav>

    <div class="border-t border-line p-3 flex items-center gap-2.5" style="padding-left:max(12px,env(safe-area-inset-left,0px))">
      <div class="w-8 h-8 rounded-full bg-accentsoft text-accent grid place-items-center text-xs font-semibold">AN</div>
      <div class="min-w-0 leading-tight"><div class="text-[13px] font-medium truncate">Amara Nwosu</div><div class="text-[11px] text-mute truncate" x-text="admin ? 'Super administrator' : 'Team plan'"></div></div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="flex-1 min-w-0 flex flex-col h-full">
    <header class="h-14 shrink-0 border-b border-line bg-surface flex items-center gap-3 gutter">
      <button class="btn btn-ghost !px-2 lg:hidden" @click="nav=true" aria-label="Open menu"><i class="i" x-ic="'menu'"></i></button>
      <div class="min-w-0">
        <div class="eyebrow leading-none" x-text="admin ? 'Admin console' : 'Workspace'"></div>
        <h1 class="font-display font-semibold text-[16px] leading-tight truncate" x-text="titles[view]"></h1>
      </div>
      <div class="ml-auto flex items-center gap-1.5">
        <span class="hidden sm:inline-flex pill p-good"><span class="w-1.5 h-1.5 rounded-full bg-good"></span>All systems operational</span>
        <button class="btn btn-ghost !px-2" @click="toggleTheme()" :aria-label="isDark ? 'Switch to light theme' : 'Switch to dark theme'"><i class="i" x-ic="isDark ? 'sun' : 'moon'"></i></button>
      </div>
    </header>

    <main :class="view==='chat' ? 'overflow-hidden' : 'overflow-y-auto'" class="flex-1 min-h-0 relative">

      <!-- =============== HOME =============== -->
      <template x-if="view==='home'">
        <div class="gutter py-8 max-w-[1120px] mx-auto rise">
          <div class="max-w-[640px]">
            <div class="eyebrow mb-2">New analysis</div>
            <h2 class="h1 text-[32px] sm:text-[38px]">Ask your data a question. Get an answer you can check.</h2>
            <p class="mt-3 text-mute text-[15px] leading-relaxed">Bring a database or a file. Every number comes from a query you can read, run read-only, against the data you own.</p>
          </div>

          <div class="mt-7 grid md:grid-cols-2 gap-4">
            <button @click="go('connections'); openConn()" class="card p-5 text-left hover:border-accent transition-colors group focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
              <div class="flex items-start gap-4">
                <div class="w-11 h-11 rounded-lg bg-accentsoft text-accent grid place-items-center shrink-0"><i class="i !w-6 !h-6" x-ic="'plug'"></i></div>
                <div class="min-w-0">
                  <div class="h2">Connect a database</div>
                  <p class="text-mute mt-1">Link a live database with a read-only login. The schema is mapped for you.</p>
                  <div class="mt-3 flex flex-wrap gap-1.5"><template x-for="t in ['PostgreSQL','MySQL','MariaDB','SQL Server']"><span class="pill p-mute" x-text="t"></span></template></div>
                </div>
                <i class="i ml-auto mt-1 text-mute group-hover:text-accent" x-ic="'chevron'"></i>
              </div>
            </button>
            <button @click="go('datasets')" class="card p-5 text-left hover:border-accent transition-colors group focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
              <div class="flex items-start gap-4">
                <div class="w-11 h-11 rounded-lg bg-infosoft text-info grid place-items-center shrink-0"><i class="i !w-6 !h-6" x-ic="'upload'"></i></div>
                <div class="min-w-0">
                  <div class="h2">Upload a database</div>
                  <p class="text-mute mt-1">Drop in a file. It is validated, imported into an isolated store and ready in minutes.</p>
                  <div class="mt-3 flex flex-wrap gap-1.5"><template x-for="t in ['SQLite','SQL dump','CSV','Excel','JSON']"><span class="pill p-mute" x-text="t"></span></template></div>
                </div>
                <i class="i ml-auto mt-1 text-mute group-hover:text-accent" x-ic="'chevron'"></i>
              </div>
            </button>
          </div>

          <div class="mt-8 grid lg:grid-cols-3 gap-4">
            <section class="card lg:col-span-1">
              <div class="px-4 pt-4 pb-2 flex items-center"><h3 class="h2">Your data sources</h3></div>
              <ul class="px-2 pb-2">
                <template x-for="s in sources" :key="s.name">
                  <li><button class="w-full flex items-center gap-3 px-2 py-2 rounded-md hover:bg-sunk text-left" @click="source=s.name; go('chat')">
                    <span class="w-8 h-8 rounded-md bg-sunk grid place-items-center text-mute shrink-0"><i class="i !w-4 !h-4" x-ic="s.kind==='db' ? 'db' : 'file'"></i></span>
                    <span class="min-w-0 flex-1"><span class="block text-[13px] font-medium truncate" x-text="s.name"></span><span class="block text-xs text-mute truncate" x-text="s.meta"></span></span>
                    <span class="pill" :class="pill(s.status)" x-text="s.status==='Ready for Analysis' ? 'Ready' : s.status"></span>
                  </button></li>
                </template>
              </ul>
            </section>
            <section class="card lg:col-span-1">
              <div class="px-4 pt-4 pb-2"><h3 class="h2">Suggested questions</h3><p class="text-xs text-mute mt-0.5">Based on the tables found in Trade Orders</p></div>
              <div class="px-4 pb-4 flex flex-col gap-2">
                <template x-for="q in suggestions" :key="q">
                  <button class="chip !h-auto py-2 !rounded-lg w-full" @click="ask(q)"><i class="i !w-4 !h-4 text-accent" x-ic="'sparkle'"></i><span x-text="q"></span></button>
                </template>
              </div>
            </section>
            <section class="card lg:col-span-1">
              <div class="px-4 pt-4 pb-2 flex items-center"><h3 class="h2">Saved analyses</h3><button class="btn btn-ghost btn-sm ml-auto" @click="go('reports')">All</button></div>
              <ul class="px-2 pb-2">
                <template x-for="r in reports.slice(0,4)" :key="r.title">
                  <li><button class="w-full flex items-center gap-3 px-2 py-2 rounded-md hover:bg-sunk text-left" @click="go('reports')">
                    <span class="w-8 h-8 rounded-md bg-accentsoft text-accent grid place-items-center shrink-0"><i class="i !w-4 !h-4" x-ic="'chart'"></i></span>
                    <span class="min-w-0"><span class="block text-[13px] font-medium truncate" x-text="r.title"></span><span class="block text-xs text-mute" x-text="r.source + ' · ' + r.saved"></span></span>
                  </button></li>
                </template>
              </ul>
            </section>
          </div>
        </div>
      </template>

      <!-- =============== CHAT =============== -->
      <template x-if="view==='chat'">
        <div class="h-full flex">
          <aside class="hidden xl:flex w-[260px] shrink-0 flex-col border-r border-line bg-surface">
            <div class="p-3"><button class="btn btn-primary w-full" @click="newChat()"><i class="i !w-4 !h-4" x-ic="'plus'"></i>New analysis</button></div>
            <div class="eyebrow px-4 pb-1">Chat history</div>
            <div class="flex-1 overflow-y-auto scroll-thin px-2 pb-3">
              <template x-for="(h,i) in history" :key="h.t">
                <button class="w-full text-left px-2.5 py-2 rounded-md hover:bg-sunk" :class="i===0 && 'bg-sunk'">
                  <span class="block text-[13px] font-medium truncate" x-text="h.t"></span>
                  <span class="block text-[11px] text-mute" x-text="h.s + ' · ' + h.d"></span>
                </button>
              </template>
            </div>
          </aside>

          <section class="flex-1 min-w-0 flex flex-col">
            <div class="shrink-0 border-b border-line bg-bg gutter py-2.5 flex flex-wrap items-center gap-2">
              <label for="src" class="text-xs text-mute">Data source</label>
              <select id="src" x-model="source" class="input !w-auto min-w-[200px] !h-8 text-xs">
                <template x-for="s in sources.filter(x=>x.status==='Connected'||x.status==='Ready for Analysis')" :key="s.name"><option :value="s.name" x-text="s.name"></option></template>
              </select>
              <span class="pill p-good"><i class="i !w-3 !h-3" x-ic="'lock'"></i>Read-only</span>
              <span class="pill p-mute hidden sm:inline-flex">Schema refreshed today 01:12</span>
            </div>

            <div id="thread" class="flex-1 min-h-0 overflow-y-auto scroll-thin">
              <div class="gutter py-6 max-w-[860px] mx-auto flex flex-col gap-6">
                <template x-for="(m,idx) in messages" :key="m.id">
                  <div class="rise">
                    <!-- user -->
                    <template x-if="m.role==='user'">
                      <div class="flex justify-end"><div class="max-w-[85%] rounded-2xl rounded-br-md bg-accent text-onaccent px-4 py-2.5 text-[14px]" x-text="m.text"></div></div>
                    </template>
                    <!-- typing -->
                    <template x-if="m.role==='typing'">
                      <div class="flex items-center gap-3 text-mute text-[13px]">
                        <span class="w-7 h-7 rounded-md bg-accentsoft text-accent grid place-items-center"><i class="i !w-4 !h-4" x-ic="'sparkle'"></i></span>
                        <span class="flex gap-1"><span class="dot w-1.5 h-1.5 rounded-full bg-mute"></span><span class="dot w-1.5 h-1.5 rounded-full bg-mute"></span><span class="dot w-1.5 h-1.5 rounded-full bg-mute"></span></span>
                        <span x-text="m.step"></span>
                      </div>
                    </template>
                    <!-- ai -->
                    <template x-if="m.role==='ai'">
                      <div class="flex gap-3">
                        <span class="w-7 h-7 shrink-0 rounded-md bg-accentsoft text-accent grid place-items-center mt-0.5"><i class="i !w-4 !h-4" x-ic="'sparkle'"></i></span>
                        <div class="min-w-0 flex-1 flex flex-col gap-3">
                          <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-mute">
                            <span class="font-medium text-ink">Analyst</span><span>·</span>
                            <span x-text="m.source"></span><span>·</span><span x-text="m.fresh"></span>
                          </div>

                          <p class="text-[15px] leading-relaxed" x-text="m.answer"></p>

                          <!-- limitation -->
                          <template x-if="m.limit">
                            <div class="rounded-[10px] border border-line bg-warnsoft p-4">
                              <div class="flex items-center gap-2 font-medium text-warn"><i class="i !w-4 !h-4" x-ic="'alert'"></i>Not enough data to calculate this</div>
                              <div class="mt-3 grid sm:grid-cols-2 gap-4 text-[13px]">
                                <div><div class="eyebrow mb-1">Found</div><ul class="space-y-1"><template x-for="f in m.limit.found"><li class="flex gap-2"><i class="i !w-4 !h-4 text-good" x-ic="'check'"></i><code class="font-mono text-xs" x-text="f"></code></li></template></ul></div>
                                <div><div class="eyebrow mb-1">Missing</div><ul class="space-y-1"><template x-for="f in m.limit.missing"><li class="flex gap-2"><i class="i !w-4 !h-4 text-bad" x-ic="'x'"></i><span x-text="f"></span></li></template></ul></div>
                              </div>
                            </div>
                          </template>

                          <!-- KPIs -->
                          <template x-if="m.kpis">
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                              <template x-for="k in m.kpis" :key="k.l">
                                <div class="card px-4 py-3">
                                  <div class="text-xs text-mute" x-text="k.l"></div>
                                  <div class="font-display text-[24px] font-semibold num leading-tight mt-0.5" x-text="k.v"></div>
                                  <div class="text-xs num mt-0.5" :class="k.up ? 'text-good' : 'text-mute'" x-text="k.d"></div>
                                </div>
                              </template>
                            </div>
                          </template>

                          <!-- chart -->
                          <template x-if="m.chart">
                            <div class="card overflow-hidden">
                              <div class="px-4 pt-3 flex flex-wrap items-center gap-2">

                                <div class="ml-auto inline-flex p-0.5 rounded-md bg-sunk text-xs" x-show="m.chart.kind!=='doughnut'" role="group" aria-label="Chart type">
                                  <template x-for="k in ['line','bar','area']"><button class="px-2.5 h-7 rounded capitalize" :class="m.chart.kind===k ? 'bg-surface text-ink shadow-sm' : 'text-mute'" @click="m.chart.kind=k" x-text="k"></button></template>
                                </div>
                              </div>
                              <div class="h-[260px] px-2 pb-2" x-chart="m.chart" role="img" :aria-label="m.chart.title"></div>
                            </div>
                          </template>

                          <!-- table -->
                          <template x-if="m.table">
                            <details class="card overflow-hidden group" open>
                              <summary class="px-4 h-10 flex items-center gap-2 cursor-pointer select-none text-[13px] font-medium list-none"><i class="i !w-4 !h-4 text-mute" x-ic="'table'"></i>Data table<span class="text-xs text-mute font-normal" x-text="'· ' + m.table.rows.length + ' rows'"></span><i class="i !w-4 !h-4 ml-auto text-mute transition-transform group-open:rotate-90" x-ic="'chevron'"></i></summary>
                              <div x-data="{k:null,d:1, rows(t){ if(this.k===null) return t.rows; const k=this.k,d=this.d; return [...t.rows].sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*d) }}" class="overflow-x-auto scroll-thin border-t border-line">
                                <table class="w-full text-[13px]">
                                  <thead><tr><template x-for="(c,ci) in m.table.cols" :key="c.h"><th class="th cursor-pointer select-none" :class="c.num && 'text-right'" @click="k===ci ? d=-d : (k=ci, d=1)" :aria-sort="k===ci ? (d===1?'ascending':'descending') : 'none'"><span x-text="c.h"></span><span class="ml-1 text-accent" x-show="k===ci" x-text="d===1 ? '↑' : '↓'"></span></th></template></tr></thead>
                                  <tbody><template x-for="r in rows(m.table)" :key="r[0]"><tr class="hover:bg-sunk"><template x-for="(c,ci) in m.table.cols" :key="c.h"><td class="td num" :class="c.num && 'text-right'" x-text="cell(r[ci],c)"></td></template></tr></template></tbody>
                                </table>
                              </div>
                            </details>
                          </template>

                          <!-- interpretation -->
                          <template x-if="m.note">
                            <div class="rounded-[10px] border border-dashed border-line px-4 py-3 text-[13px] leading-relaxed">
                              <div class="eyebrow mb-1 flex items-center gap-1.5"><i class="i !w-3.5 !h-3.5" x-ic="'sparkle'"></i>Interpretation · written by the AI, not calculated</div>
                              <span x-text="m.note"></span>
                            </div>
                          </template>

                          <!-- sql -->
                          <template x-if="m.sql">
                            <details class="card overflow-hidden group">
                              <summary class="px-4 h-10 flex items-center gap-2 cursor-pointer select-none text-[13px] font-medium list-none"><i class="i !w-4 !h-4 text-mute" x-ic="'code'"></i>Generated SQL<span class="pill p-good ml-1"><i class="i !w-3 !h-3" x-ic="'shield'"></i>Validated · read-only</span><i class="i !w-4 !h-4 ml-auto text-mute transition-transform group-open:rotate-90" x-ic="'chevron'"></i></summary>
                              <div class="border-t border-line bg-sunk">
                                <pre class="px-4 py-3 overflow-x-auto scroll-thin font-mono text-xs leading-relaxed" x-html="hl(m.sql)"></pre>
                                <div class="px-4 pb-3 flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-mute"><span>Executed in <b class="text-ink font-medium num" x-text="m.ms"></b></span><span>Timeout 30 s</span><span>Row cap 10,000</span><span>Calculated by the database, not the model</span></div>
                              </div>
                            </details>
                          </template>

                          <div class="flex flex-wrap items-center gap-2">
                            <button class="btn btn-sm" @click="toast('Added to Saved reports')"><i class="i !w-4 !h-4" x-ic="'file'"></i>Save to report</button>
                            <button class="btn btn-sm" @click="toast('Added to Sales overview dashboard')"><i class="i !w-4 !h-4" x-ic="'grid'"></i>Add to dashboard</button>
                            <div class="inline-flex rounded-md border border-line overflow-hidden bg-surface">
                              <template x-for="f in ['CSV','Excel','PDF']"><button class="h-8 px-2.5 text-xs font-medium hover:bg-sunk border-r border-line last:border-r-0" @click="toast(f + ' export queued')" x-text="f"></button></template>
                            </div>
                          </div>

                          <template x-if="m.follow">
                            <div class="flex flex-wrap gap-2"><template x-for="f in m.follow"><button class="chip" @click="ask(f)" x-text="f"></button></template></div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>

            <div class="shrink-0 border-t border-line bg-bg gutter py-3">
              <form class="max-w-[860px] mx-auto" @submit.prevent="ask(draft)">
                <div class="card p-2 flex items-end gap-2 focus-within:border-accent">
                  <label for="q" class="sr-only">Ask a question about your data</label>
                  <div class="relative flex-1 min-w-0">
                    <textarea id="q" x-model="draft" rows="1" @keydown.enter.prevent="if(!$event.shiftKey) ask(draft)" class="block w-full resize-none bg-transparent px-2 py-1.5 text-[14px] leading-[1.5] outline-none max-h-32"></textarea>
                    <div x-show="!draft" class="pointer-events-none absolute inset-0 px-2 py-1.5 text-[14px] leading-[1.5] text-mute flex flex-nowrap gap-x-[0.28em] overflow-hidden whitespace-nowrap" aria-hidden="true">
                      <template x-for="(w,i) in ('Ask a question about ' + source + '…').split(' ')" :key="source + i">
                        <span class="inline-block transition-all duration-300 ease-out" :class="i < phShown ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-1'" x-text="w"></span>
                      </template>
                    </div>
                  </div>
                  <button type="submit" class="btn btn-primary !px-3" :disabled="!draft.trim()" aria-label="Send"><i class="i !w-4 !h-4" x-ic="'send'"></i><span class="hidden sm:inline">Send</span></button>
                </div>
                <p class="text-[11px] text-mute mt-1.5 text-center">Queries run read-only. Only the schema and small result samples are shared with the AI provider.</p>
              </form>
            </div>
          </section>
        </div>
      </template>

      <!-- =============== CONNECTIONS =============== -->
      <template x-if="view==='connections'">
        <div class="gutter py-6 max-w-[1120px] mx-auto rise">
          <div class="flex flex-wrap items-end gap-3 mb-5">
            <div><h2 class="h1">Database connections</h2><p class="text-mute mt-1">Credentials are encrypted at rest and never shown again after saving.</p></div>
            <button class="btn btn-primary ml-auto" @click="openConn()"><i class="i !w-4 !h-4" x-ic="'plus'"></i>Connect database</button>
          </div>
          <div class="grid md:grid-cols-2 gap-4">
            <template x-for="c in conns" :key="c.id">
              <article class="card p-4 flex flex-col gap-3">
                <div class="flex items-start gap-3">
                  <div class="w-10 h-10 rounded-lg bg-sunk grid place-items-center text-mute shrink-0"><i class="i" x-ic="'db'"></i></div>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2"><h3 class="text-[15px] font-semibold truncate" x-text="c.name"></h3></div>
                    <div class="text-xs text-mute truncate"><span x-text="c.type"></span> · <span class="font-mono" x-text="c.host"></span></div>
                  </div>
                  <span class="pill" :class="pill(c.status)" x-text="c.status"></span>
                </div>
                <template x-if="c.error"><div class="rounded-md bg-badsoft text-bad text-xs px-3 py-2" x-text="c.error"></div></template>
                <dl class="grid grid-cols-3 gap-2 text-xs">
                  <div><dt class="text-mute">Tables</dt><dd class="num font-medium text-[13px]" x-text="c.tables ?? '—'"></dd></div>
                  <div><dt class="text-mute">Last checked</dt><dd class="font-medium text-[13px]" x-text="c.checked"></dd></div>
                  <div><dt class="text-mute">Schema</dt><dd class="font-medium text-[13px]" x-text="c.refreshed"></dd></div>
                </dl>
                <div class="flex flex-wrap gap-2 pt-1 border-t border-line -mx-4 px-4 pt-3">
                  <button class="btn btn-sm" :disabled="c.busy" @click="testConn(c)"><i class="i !w-4 !h-4" x-ic="'pulse'"></i><span x-text="c.busy==='test' ? 'Testing…' : 'Test'"></span></button>
                  <button class="btn btn-sm" :disabled="c.busy || !c.tables" @click="refreshSchema(c)"><i class="i !w-4 !h-4" x-ic="'refresh'"></i><span x-text="c.busy==='refresh' ? 'Refreshing…' : 'Refresh schema'"></span></button>
                  <button class="btn btn-sm" :disabled="!c.tables" @click="schemaFor=c"><i class="i !w-4 !h-4" x-ic="'layers'"></i>Schema</button>
                  <button class="btn btn-sm btn-danger ml-auto" @click="c.confirm = !c.confirm" x-show="!c.confirm">Disconnect</button>
                  <template x-if="c.confirm"><div class="ml-auto flex gap-2 items-center"><span class="text-xs text-mute">Remove this connection?</span><button class="btn btn-sm btn-danger" @click="removeConn(c)">Remove</button><button class="btn btn-sm" @click="c.confirm=false">Keep</button></div></template>
                </div>
              </article>
            </template>
          </div>
          <div class="mt-6 card p-4 flex gap-3 text-[13px] text-mute"><i class="i text-accent mt-0.5" x-ic="'shield'"></i><p>Create a dedicated read-only database user for this app. Connections to private, loopback and link-local addresses are blocked, and every query is validated before it runs.</p></div>
        </div>
      </template>

      <!-- =============== DATASETS =============== -->
      <template x-if="view==='datasets'">
        <div class="gutter py-6 max-w-[1120px] mx-auto rise">
          <div class="mb-5"><h2 class="h1">Uploaded datasets</h2><p class="text-mute mt-1">Files are scanned, imported into an isolated store and deleted on your request.</p></div>

          <div class="card border-dashed !border-2 p-8 text-center transition-colors" :class="drag && '!border-accent bg-accentsoft'" @dragover.prevent="drag=true" @dragleave.prevent="drag=false" @drop.prevent="drag=false; pick($event.dataTransfer.files)">
            <div class="mx-auto w-12 h-12 rounded-full bg-infosoft text-info grid place-items-center"><i class="i !w-6 !h-6" x-ic="'upload'"></i></div>
            <h3 class="h2 mt-3">Drop a file here</h3>
            <p class="text-mute mt-1">or choose one from your computer. Up to 250 MB on the Team plan.</p>
            <div class="mt-4 flex flex-wrap justify-center gap-2">
              <label for="file" class="btn btn-primary cursor-pointer">Choose file</label>

            </div>
            <div class="mt-4 flex flex-wrap justify-center gap-1.5 text-xs"><template x-for="f in ['.sql','.sqlite','.db','.csv','.xlsx','.json']"><span class="pill p-mute font-mono" x-text="f"></span></template></div>

                <tbody>
                  <template x-for="d in datasets" :key="d.id">
                    <tr class="hover:bg-sunk">
                      <td class="td">
                        <div class="flex items-center gap-3">
                          <span class="w-8 h-8 rounded-md bg-sunk grid place-items-center text-mute shrink-0"><i class="i !w-4 !h-4" x-ic="'file'"></i></span>
                          <div class="min-w-0">
                            <template x-if="!d.editing"><div class="font-medium truncate max-w-[260px]" x-text="d.name"></div></template>
                            <template x-if="d.editing"><input class="input !h-7 max-w-[240px]" x-model="d.name" @keydown.enter="d.editing=false" @blur="d.editing=false" :aria-label="'Rename ' + d.name" x-init="$nextTick(()=>$el.focus())"></template>
                            <div class="text-xs text-mute" x-text="d.when"></div>
                          </div>
                        </div>
                      </td>
                      <td class="td"><span class="pill p-mute" x-text="d.fmt"></span></td>
                      <td class="td text-right num" x-text="d.size"></td>
                      <td class="td text-right num" x-text="d.tables ?? '—'"></td>
                      <td class="td min-w-[190px]">
                        <span class="pill" :class="pill(d.status)" x-text="d.status"></span>
                        <template x-if="d.progress!==null && d.progress<100 && d.status!=='Failed'"><div class="mt-1.5 h-1 rounded bg-sunk overflow-hidden w-36" role="progressbar" :aria-valuenow="Math.round(d.progress)"><div class="h-full bg-accent transition-all" :style="'width:'+d.progress+'%'"></div></div></template>

                      <td class="td">
                        <div class="flex justify-end gap-1.5">
                          <button class="btn btn-sm" :disabled="d.status!=='Ready for Analysis'" @click="source=d.name; go('chat')">Analyze</button>

                          <button class="btn btn-sm btn-ghost !px-2 text-bad" x-show="!d.confirm" @click="d.confirm=true" :aria-label="'Delete ' + d.name">Delete</button>
                          <template x-if="d.confirm"><span class="inline-flex gap-1.5"><button class="btn btn-sm btn-danger" @click="removeDataset(d)">Confirm</button><button class="btn btn-sm" @click="d.confirm=false">Cancel</button></span></template>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>

          <div class="flex flex-wrap items-end gap-3 mb-5">

              <div class="px-4 pt-3 pb-2 flex items-center"><h3 class="text-[13px] font-medium">Needs attention</h3><button class="btn btn-ghost btn-sm ml-auto" @click="go('admin-audit')">Open audit log</button></div>
              <ul>
                <template x-for="a in alerts" :key="a.t">
                  <li class="px-4 py-2.5 border-t border-line flex items-start gap-3">
                    <span class="pill mt-0.5" :class="a.tone" x-text="a.sev"></span>
                    <div class="min-w-0 flex-1"><div class="text-[13px] font-medium" x-text="a.t"></div><div class="text-xs text-mute" x-text="a.d"></div></div>
                    <span class="text-xs text-mute whitespace-nowrap" x-text="a.w"></span>
                  </li>
                </template>
              </ul>
            </section>

              <div class="px-4 pt-3 pb-2 flex items-center"><h3 class="text-[13px] font-medium">Health</h3><button class="btn btn-ghost btn-sm ml-auto" @click="go('admin-health')">Details</button></div>

                <template x-for="h in health.slice(0,6)" :key="h.n">

      <!-- =============== ADMIN: USERS =============== -->

          <div class="flex flex-wrap gap-2 mb-3">
            <div class="relative flex-1 min-w-[220px] max-w-sm"><i class="i !w-4 !h-4 absolute left-3 top-2.5 text-mute" x-ic="'search'"></i><label for="us" class="sr-only">Search users</label><input id="us" x-model="uq" class="input !pl-9" placeholder="Search name, email or organization"></div>

            <div class="overflow-x-auto scroll-thin">
              <table class="w-full text-[13px] min-w-[900px]">
                <thead><tr><th class="th">User</th><th class="th">Organization</th><th class="th">Plan</th><th class="th">Role</th><th class="th">Status</th><th class="th text-right">AI requests (30d)</th><th class="th">Last active</th><th class="th"></th></tr></thead>
                <tbody>
                  <template x-for="u in filteredUsers" :key="u.e">
                    <tr class="hover:bg-sunk">
                      <td class="td"><div class="flex items-center gap-2.5"><span class="w-7 h-7 rounded-full bg-accentsoft text-accent grid place-items-center text-[11px] font-semibold" x-text="u.n.split(' ').map(x=>x[0]).join('')"></span><div class="min-w-0"><div class="font-medium" x-text="u.n"></div><div class="text-xs text-mute" x-text="u.e"></div></div></div></td>
                      <td class="td" x-text="u.org"></td>
                      <td class="td"><span class="pill p-mute" x-text="u.plan"></span></td>
                      <td class="td text-mute" x-text="u.role"></td>
                      <td class="td"><span class="pill" :class="pill(u.st)" x-text="u.st"></span></td>
                      <td class="td text-right num" x-text="u.req.toLocaleString()"></td>
                      <td class="td text-mute" x-text="u.last"></td>
                      <td class="td">
                        <div class="flex justify-end gap-1.5">
                          <template x-if="!u.ask"><span class="inline-flex gap-1.5">
                            <button class="btn btn-sm" x-show="u.st==='Active'" @click="u.ask='suspend'">Suspend</button>
                            <button class="btn btn-sm" x-show="u.st==='Suspended'" @click="u.ask='reactivate'">Reactivate</button>
                            <button class="btn btn-sm btn-ghost" @click="u.ask='revoke'">Revoke sessions</button>
                          </span></template>
                          <template x-if="u.ask"><span class="inline-flex gap-1.5 items-center"><span class="text-xs text-mute">Confirm <span x-text="u.ask"></span>?</span><button class="btn btn-sm btn-primary" @click="userAction(u)">Confirm</button><button class="btn btn-sm" @click="u.ask=null">Cancel</button></span></template>
                        </div>
                      </td>
                    </tr>
                  </template>
                  <template x-if="!filteredUsers.length"><tr><td colspan="8" class="td text-center text-mute py-10">No users match these filters.</td></tr></template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>

      <!-- =============== ADMIN: SOURCES =============== -->
      <template x-if="view==='admin-sources'">
        <div class="gutter py-6 max-w-[1240px] mx-auto rise">
          <div class="mb-4"><h2 class="h1">Data sources</h2><p class="text-mute mt-1">Registry of connections and uploaded datasets across all accounts.</p></div>
          <div class="card p-3 mb-4 flex gap-3 items-center text-[13px] text-mute"><i class="i text-accent" x-ic="'lock'"></i>Stored passwords and encryption keys cannot be revealed from this console. Diagnostics show sanitized errors only.</div>
          <div class="flex gap-1 border-b border-line mb-4"><button class="tab" :class="srcTab==='c' && 'tab-on'" @click="srcTab='c'">Connections</button><button class="tab" :class="srcTab==='d' && 'tab-on'" @click="srcTab='d'">Datasets</button></div>

          <div class="card overflow-hidden" x-show="srcTab==='c'">
            <div class="overflow-x-auto scroll-thin">
              <table class="w-full text-[13px] min-w-[1000px]">
                <thead><tr><th class="th">ID</th><th class="th">Name</th><th class="th">Owner</th><th class="th">Type</th><th class="th">Status</th><th class="th">Last success</th><th class="th">Last failure</th><th class="th">Recent error</th><th class="th"></th></tr></thead>
                <tbody>
                  <template x-for="c in regConns" :key="c.id">
                    <tr class="hover:bg-sunk">
                      <td class="td font-mono text-xs text-mute" x-text="c.id"></td>
                      <td class="td font-medium" x-text="c.name"></td>
                      <td class="td"><div x-text="c.owner"></div><div class="text-xs text-mute" x-text="c.org"></div></td>
                      <td class="td" x-text="c.type"></td>
                      <td class="td"><span class="pill" :class="pill(c.status)" x-text="c.status"></span></td>
                      <td class="td text-mute" x-text="c.ok"></td>
                      <td class="td text-mute" x-text="c.fail"></td>
                      <td class="td text-xs text-mute max-w-[220px]" x-text="c.err || '—'"></td>
                      <td class="td"><div class="flex justify-end gap-1.5">
                        <button class="btn btn-sm" @click="adminAct('Health check queued for ' + c.id, 'connection.health_check', c.id)">Health check</button>
                        <button class="btn btn-sm" @click="c.status = c.status==='Disabled' ? 'Connected' : 'Disabled'; adminAct((c.status==='Disabled'?'Disabled ':'Re-enabled ') + c.id, c.status==='Disabled'?'connection.disable':'connection.enable', c.id)" x-text="c.status==='Disabled' ? 'Re-enable' : 'Disable'"></button>
                      </div></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <div class="card overflow-hidden" x-show="srcTab==='d'">
            <div class="overflow-x-auto scroll-thin">
              <table class="w-full text-[13px] min-w-[1000px]">
                <thead><tr><th class="th">ID</th><th class="th">File</th><th class="th">Owner</th><th class="th">Format</th><th class="th text-right">Size</th><th class="th text-right">Tables</th><th class="th">Status</th><th class="th">Retention</th><th class="th"></th></tr></thead>
                <tbody>
                  <template x-for="d in regData" :key="d.id">
                    <tr class="hover:bg-sunk">
                      <td class="td font-mono text-xs text-mute" x-text="d.id"></td>
                      <td class="td font-medium" x-text="d.file"></td>
                      <td class="td"><div x-text="d.owner"></div><div class="text-xs text-mute" x-text="d.org"></div></td>
                      <td class="td" x-text="d.fmt"></td>
                      <td class="td text-right num" x-text="d.size"></td>
                      <td class="td text-right num" x-text="d.tables ?? '—'"></td>
                      <td class="td"><span class="pill" :class="pill(d.st)" x-text="d.st"></span><div class="text-xs text-bad mt-1 max-w-[220px]" x-show="d.err" x-text="d.err"></div></td>
                      <td class="td text-mute" x-text="d.ret"></td>
                      <td class="td"><div class="flex justify-end gap-1.5">
                        <button class="btn btn-sm" x-show="d.st==='Failed'" @click="d.st='Processing'; adminAct('Retry queued for ' + d.id, 'dataset.retry', d.id)">Retry</button>
                        <button class="btn btn-sm" x-show="d.st==='Importing'||d.st==='Processing'" @click="d.st='Failed'; d.err='Cancelled by administrator'; adminAct('Cancelled job for ' + d.id, 'dataset.cancel', d.id)">Cancel</button>
                        <button class="btn btn-sm btn-danger" x-show="d.st!=='Disabled'" @click="d.st='Disabled'; adminAct('Access disabled for ' + d.id, 'dataset.disable', d.id)">Disable</button>
                      </div></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>

      <!-- =============== ADMIN: AI & PLANS =============== -->
      <template x-if="view==='admin-ai'">
        <div class="gutter py-6 max-w-[1240px] mx-auto rise flex flex-col gap-4">
          <div><h2 class="h1">AI service and plans</h2><p class="text-mute mt-1">Changing the model never bypasses query validation or read-only enforcement.</p></div>
          <div class="grid lg:grid-cols-5 gap-4">
            <section class="card p-5 lg:col-span-3">
              <div class="flex items-center gap-2 mb-4"><h3 class="h2">Provider</h3><span class="pill p-good ml-auto"><span class="w-1.5 h-1.5 rounded-full bg-good"></span>Available · median 1.4 s</span></div>
              <div class="grid sm:grid-cols-2 gap-4">
                <div><label class="lbl" for="ap">AI provider</label><select id="ap" class="input" x-model="ai.provider"><option>OpenAI</option></select></div>
                <div><label class="lbl" for="am">Default model</label><select id="am" class="input" x-model="ai.model"><option>gpt-4.1</option><option>gpt-4.1-mini</option><option>o4-mini</option></select></div>
                <div class="sm:col-span-2"><label class="lbl" for="ak">API key</label>
                  <div class="flex gap-2"><input id="ak" class="input font-mono" value="sk-••••••••••••••••••••••a91F" readonly><button class="btn" @click="adminAct('API key rotation started','ai.key_rotate','openai')">Rotate</button></div>
                  <p class="text-xs text-mute mt-1">Stored encrypted. The full key is never shown after saving.</p></div>
                <div><label class="lbl" for="mo">Max output tokens</label><input id="mo" type="number" class="input num" x-model.number="ai.maxOut"></div>
                <div><label class="lbl" for="mt">Request timeout (s)</label><input id="mt" type="number" class="input num" x-model.number="ai.timeout"></div>
                <div><label class="lbl" for="mr">Retry limit</label><input id="mr" type="number" class="input num" x-model.number="ai.retries"></div>
                <div><label class="lbl" for="mu">Requests per user per day</label><input id="mu" type="number" class="input num" x-model.number="ai.perUser"></div>
              </div>
              <div class="mt-4 flex items-center gap-3"><button class="btn btn-primary" @click="adminAct('AI settings saved','settings.update','ai')">Save settings</button><span class="text-xs text-mute">Changes are validated and logged.</span></div>
            </section>
            <section class="card overflow-hidden lg:col-span-2">
              <div class="px-5 pt-4"><h3 class="h2">Estimated cost</h3><div class="text-xs text-mute">October to date, by model</div></div>
              <div class="h-[250px] px-2" x-chart="costChart"></div>
              <div class="px-5 pb-4 flex items-baseline gap-2"><span class="font-display text-[26px] font-semibold num">$3,842</span><span class="text-xs text-mute">of $5,000 monthly budget</span></div>
            </section>
          </div>
          <section class="card overflow-hidden">
            <div class="px-5 pt-4 pb-3 flex items-center"><h3 class="h2">Plans and limits</h3><button class="btn btn-sm ml-auto" @click="adminAct('Plan limits saved','plan.update','all')">Save plans</button></div>
            <div class="overflow-x-auto scroll-thin">
              <table class="w-full text-[13px] min-w-[720px]">
                <thead><tr><th class="th">Limit</th><template x-for="p in plans" :key="p.n"><th class="th" x-text="p.n"></th></template></tr></thead>
                <tbody>
                  <template x-for="(row,ri) in planRows" :key="row.k">
                    <tr><td class="td font-medium" x-text="row.l"></td>
                      <template x-for="p in plans" :key="p.n"><td class="td"><label class="sr-only" :for="'pl-'+p.n+row.k" x-text="row.l + ' for ' + p.n"></label><input :id="'pl-'+p.n+row.k" type="number" class="input num !h-8 !w-28" x-model.number="p[row.k]"></td></template>
                    </tr>
                  </template>
                  <tr><td class="td font-medium">Subscribers</td><template x-for="p in plans" :key="p.n"><td class="td num text-mute" x-text="p.subs.toLocaleString()"></td></template></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </template>

      <!-- =============== ADMIN: CONNECTORS =============== -->
      <template x-if="view==='admin-connectors'">
        <div class="gutter py-6 max-w-[1240px] mx-auto rise">
          <div class="mb-5"><h2 class="h1">Connectors</h2><p class="text-mute mt-1">A connector is listed as available only after it is implemented and tested.</p></div>
          <div class="card overflow-hidden">
            <div class="overflow-x-auto scroll-thin">
              <table class="w-full text-[13px] min-w-[820px]">
                <thead><tr><th class="th">Connector</th><th class="th">Driver</th><th class="th">Status</th><th class="th text-right">Connections</th><th class="th text-right">Failure rate (7d)</th><th class="th">Max result rows</th><th class="th text-right">Enabled</th></tr></thead>
                <tbody>
                  <template x-for="c in connectors" :key="c.n">
                    <tr :class="!c.impl && 'opacity-60'">
                      <td class="td"><div class="flex items-center gap-2.5"><span class="w-8 h-8 rounded-md bg-sunk grid place-items-center text-mute"><i class="i !w-4 !h-4" x-ic="'db'"></i></span><span class="font-medium" x-text="c.n"></span></div></td>
                      <td class="td font-mono text-xs text-mute" x-text="c.drv"></td>
                      <td class="td"><span class="pill" :class="c.impl ? pill(c.on ? c.st : 'Disabled') : 'p-mute'" x-text="c.impl ? (c.on ? c.st : 'Disabled') : 'Not implemented'"></span></td>
                      <td class="td text-right num" x-text="c.impl ? c.cnt.toLocaleString() : '—'"></td>
                      <td class="td text-right num" :class="c.fr>3 && 'text-warn'" x-text="c.impl ? c.fr + '%' : '—'"></td>
                      <td class="td num text-mute" x-text="c.impl ? '10,000' : '—'"></td>
                      <td class="td text-right"><button role="switch" :disabled="!c.impl" :aria-checked="c.on" :aria-label="'Enable ' + c.n" @click="c.on=!c.on; adminAct((c.on?'Enabled ':'Disabled ') + c.n + ' connector','connector.toggle',c.n)" class="w-10 h-6 rounded-full p-0.5 transition-colors disabled:opacity-40" :class="c.on && c.impl ? 'bg-accent' : 'bg-line'"><span class="block w-5 h-5 rounded-full bg-surface transition-transform" :class="c.on && c.impl && 'translate-x-4'"></span></button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
          <p class="text-xs text-mute mt-3">Disabling a connector blocks new connections of that type. Existing connections keep working for 7 days, then move to Disconnected.</p>
        </div>
      </template>

      <!-- =============== ADMIN: AUDIT =============== -->
      <template x-if="view==='admin-audit'">
        <div class="gutter py-6 max-w-[1240px] mx-auto rise">
          <div class="mb-5"><h2 class="h1">Audit log</h2><p class="text-mute mt-1">Append-only. Passwords, API keys and encryption keys are never written here.</p></div>
          <div class="flex flex-wrap gap-2 mb-3">
            <div class="relative flex-1 min-w-[220px] max-w-sm"><i class="i !w-4 !h-4 absolute left-3 top-2.5 text-mute" x-ic="'search'"></i><label for="aq" class="sr-only">Search audit log</label><input id="aq" x-model="aq" class="input !pl-9" placeholder="Search actor, event or target"></div>
            <label for="ac" class="sr-only">Category</label>
            <select id="ac" x-model="ac" class="input !w-auto"><option value="">All categories</option><option>Authentication</option><option>Admin action</option><option>Connection</option><option>Upload</option><option>Query</option><option>Configuration</option></select>
          </div>
          <div class="card overflow-hidden">
            <div class="overflow-x-auto scroll-thin">
              <table class="w-full text-[13px] min-w-[860px]">
                <thead><tr><th class="th">Time</th><th class="th">Actor</th><th class="th">Category</th><th class="th">Event</th><th class="th">Target</th><th class="th">Outcome</th><th class="th">IP</th></tr></thead>
                <tbody>
                  <template x-for="a in filteredAudit" :key="a.id">
                    <tr class="hover:bg-sunk">
                      <td class="td text-mute whitespace-nowrap num" x-text="a.t"></td>
                      <td class="td" x-text="a.a"></td>
                      <td class="td"><span class="pill p-mute" x-text="a.c"></span></td>
                      <td class="td font-mono text-xs" x-text="a.e"></td>
                      <td class="td font-mono text-xs text-mute" x-text="a.g"></td>
                      <td class="td"><span class="pill" :class="a.o==='Success' ? 'p-good' : a.o==='Denied' ? 'p-warn' : 'p-bad'" x-text="a.o"></span></td>
                      <td class="td font-mono text-xs text-mute" x-text="a.ip"></td>
                    </tr>
                  </template>
                  <template x-if="!filteredAudit.length"><tr><td colspan="7" class="td text-center text-mute py-10">No events match these filters.</td></tr></template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>

      <!-- =============== ADMIN: HEALTH =============== -->
      <template x-if="view==='admin-health'">
        <div class="gutter py-6 max-w-[1240px] mx-auto rise">
          <div class="mb-5"><h2 class="h1">System health</h2><p class="text-mute mt-1">Checked every 30 seconds. Details never include secrets or internal hostnames.</p></div>
          <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <template x-for="h in health" :key="h.n">
              <div class="card px-4 py-3">
                <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full" :class="h.st==='Operational' ? 'bg-good' : 'bg-warn'"></span><span class="text-[13px] font-medium" x-text="h.n"></span></div>
                <div class="font-display text-[22px] font-semibold num mt-1" x-text="h.m"></div>
                <div class="text-xs" :class="h.st==='Operational' ? 'text-mute' : 'text-warn'" x-text="h.d"></div>
              </div>
            </template>
          </div>
          <div class="grid lg:grid-cols-5 gap-4 mt-4">
            <section class="card overflow-hidden lg:col-span-2">
              <div class="px-4 pt-3"><h3 class="text-[13px] font-medium">Queue depth</h3><div class="text-xs text-mute">Jobs waiting, last 24 hours</div></div>
              <div class="h-[250px] px-2 pb-2" x-chart="queueChart"></div>
            </section>
            <section class="card overflow-hidden lg:col-span-3">
              <div class="px-4 pt-3 pb-2"><h3 class="text-[13px] font-medium">Failed jobs</h3><div class="text-xs text-mute">Retries stop after 3 attempts to avoid duplicate processing.</div></div>
              <div class="overflow-x-auto scroll-thin">
                <table class="w-full text-[13px] min-w-[520px]">
                  <thead><tr><th class="th">Job</th><th class="th">Error</th><th class="th text-right">Attempts</th><th class="th"></th></tr></thead>
                  <tbody>
                    <template x-for="j in jobs" :key="j.id">
                      <tr>
                        <td class="td"><div class="font-mono text-xs" x-text="j.id"></div><div class="text-xs text-mute" x-text="j.t"></div></td>
                        <td class="td text-xs text-mute max-w-[240px]" x-text="j.e"></td>
                        <td class="td text-right num" x-text="j.a + ' / 3'"></td>
                        <td class="td text-right"><button class="btn btn-sm" :disabled="j.a>=3 || j.q" @click="j.q=true; j.a++; adminAct('Retry queued for ' + j.id,'job.retry',j.id)" x-text="j.a>=3 ? 'Limit reached' : j.q ? 'Queued' : 'Retry'"></button></td>
                      </tr>
                    </template>

<script>
/* ---------- charts ---------- */
const charts = new Set();
function tok() {
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  return { ink: g('--ink'), mute: g('--mute'), line: g('--line'), surface: g('--surface'),
    cat: [g('--c1'), g('--c2'), g('--c3'), g('--c4'), g('--c5')] };
}
function fmtV(s, v) {
  if (v == null) return '';
  if (s.fmt === '$k') return v >= 1000 ? '$' + (v / 1000).toFixed(2) + 'M' : '$' + v + 'k';
  if (s.fmt === '$') return '$' + Number(v).toLocaleString();
  if (s.fmt === '%') return v + '%';
  return Number(v).toLocaleString();
}
function buildOption(s, t) {
  const f = v => fmtV(s, v), multi = s.series.length > 1;
  const common = { animationDuration: 350, textStyle: { fontFamily: 'IBM Plex Sans, system-ui, sans-serif', color: t.mute },
    tooltip: { trigger: s.kind === 'doughnut' ? 'item' : 'axis', backgroundColor: t.surface, borderColor: t.line, borderWidth: 1,
      textStyle: { color: t.ink, fontSize: 12 }, valueFormatter: f, axisPointer: { type: 'line', lineStyle: { color: t.line } } } };
  if (s.kind === 'doughnut') {
    return { ...common,
      legend: { orient: 'vertical', right: 8, top: 'center', icon: 'circle', itemWidth: 8, itemHeight: 8, textStyle: { color: t.ink, fontSize: 12 }, formatter: n => n },
      series: [{ type: 'pie', radius: ['56%', '80%'], center: ['34%', '50%'], itemStyle: { borderColor: t.surface, borderWidth: 2 }, label: { show: false },
        data: s.x.map((n, i) => ({ name: n, value: s.series[0].data[i], itemStyle: { color: t.cat[i % t.cat.length] } })) }] };
  }
  const horiz = s.kind === 'hbar';
  const axisCat = { type: 'category', data: s.x, axisLine: { lineStyle: { color: t.line } }, axisTick: { show: false }, axisLabel: { color: t.mute, fontSize: 11 }, inverse: horiz };
  const axisVal = { type: 'value', splitLine: { lineStyle: { color: t.line, type: 'dashed' } }, axisLabel: { color: t.mute, fontSize: 11, formatter: f } };
  const series = s.series.map((d, i) => {
    const color = d.muted ? t.mute : t.cat[i % t.cat.length];
    const base = { name: d.name, data: d.data, itemStyle: { color }, lineStyle: { color, width: 2.2, type: d.muted ? 'dashed' : 'solid' } };
    if (s.kind === 'bar' || horiz) return { ...base, type: 'bar', barMaxWidth: 28, itemStyle: { color, borderRadius: horiz ? [0, 3, 3, 0] : [3, 3, 0, 0] } };
    const last = d.data.length - 1;
    return { ...base, type: 'line', symbol: 'circle', symbolSize: (v, p) => (p.dataIndex === last && !d.muted ? 8 : 0), showSymbol: true,
      areaStyle: s.kind === 'area' ? { color, opacity: 0.12 } : undefined, emphasis: { focus: 'series' } };
  });
  return { ...common,
    legend: multi ? { top: 0, left: 8, icon: 'roundRect', itemWidth: 10, itemHeight: 3, textStyle: { color: t.mute, fontSize: 12 } } : undefined,
    grid: { left: 8, right: 16, top: multi ? 34 : 14, bottom: 4, containLabel: true },
    xAxis: horiz ? axisVal : axisCat, yAxis: horiz ? axisCat : axisVal, series };
}
function refreshCharts() {
  const t = tok();
  charts.forEach(c => { if (!c.el.isConnected) { charts.delete(c); c.inst.dispose(); return; } c.render(t); });
}

document.addEventListener('alpine:init', () => {
  Alpine.directive('ic', (el, { expression }, { evaluate, effect }) => {
    effect(() => { const n = evaluate(expression); el.innerHTML = n ? svg(n) : ''; });
  });
  Alpine.directive('chart', (el, { expression }, { evaluate, effect, cleanup }) => {
    const inst = echarts.init(el, null, { renderer: 'svg' });
    const entry = { inst, el, render: t => inst.setOption(buildOption(evaluate(expression), t || tok()), true) };
    charts.add(entry);
    effect(() => entry.render());
    const ro = new ResizeObserver(() => inst.resize()); ro.observe(el);
    cleanup(() => { ro.disconnect(); charts.delete(entry); inst.dispose(); });
  });
});

/* ---------- icons ---------- */
const ICONS = {

  check:'M5 12l5 5 9-10', refresh:'M20 11a8 8 0 0 0-14.5-4M4 5v4h4M4 13a8 8 0 0 0 14.5 4M20 19v-4h-4',
  code:'M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14', chevron:'M9 6l6 6-6 6', lock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3',
  alert:'M12 4l9 16H3zM12 10v4M12 17h0', table:'M4 5h16v14H4zM4 10h16M10 5v14', chart:'M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6',
  layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5', card:'M3 6h18v12H3zM3 10h18'
};
function svg(n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (ICONS[n] || '') + '"/></svg>'; }

/* ---------- helpers ---------- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
const REV26 = [468,455,539,562,598,641,629,688,716], REV25 = [412,438,501,476,529,563,547,604,631];
function wave(n, base, amp, seed) { return Array.from({ length: n }, (_, i) => Math.max(0, Math.round(base + amp * Math.sin(i * 0.9 + seed) + amp * 0.5 * Math.cos(i * 0.37 + seed * 2)))); }
function dayLabels(n) { const d = new Date(2026, 9, 28); return Array.from({ length: n }, (_, i) => { const x = new Date(d); x.setDate(d.getDate() - (n - 1 - i)); return x.toLocaleDateString('en', { month: 'short', day: 'numeric' }); }); }
function sparkPath(vals) { const mn = Math.min(...vals), mx = Math.max(...vals); return vals.map((v, i) => (i ? 'L' : 'M') + (i * 200 / (vals.length - 1)).toFixed(1) + ' ' + (52 - (v - mn) / (mx - mn || 1) * 44).toFixed(1)).join(' '); }

function app() {
  return {
    view: 'home', admin: false, nav: false, isDark: false, drag: false, editDash: false,
    titles: { home:'Home', chat:'New analysis', connections:'Database connections', datasets:'Uploaded datasets', reports:'Saved reports', dashboards:'Dashboards', usage:'Usage', account:'Settings',
      'admin-overview':'Overview', 'admin-users':'Users and organizations', 'admin-sources':'Data sources', 'admin-ai':'AI service and plans', 'admin-connectors':'Connectors', 'admin-audit':'Audit log', 'admin-health':'System health' },

    adminNav: [ {k:'admin-overview',l:'Overview',i:'chart'}, {k:'admin-users',l:'Users and orgs',i:'users'}, {k:'admin-sources',l:'Data sources',i:'db'}, {k:'admin-ai',l:'AI and plans',i:'cpu'}, {k:'admin-connectors',l:'Connectors',i:'plug'}, {k:'admin-audit',l:'Audit log',i:'log'}, {k:'admin-health',l:'System health',i:'pulse',badge:'1'} ],
    get items() { return this.admin ? this.adminNav : this.userNav; },

    init() {
      try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
      this.syncTheme();
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { this.syncTheme(); setTimeout(refreshCharts, 30); });

      window.addEventListener('hashchange', route); route();
      this.messages = this.seed();
      this.startPlaceholder();
      this.$watch('source', () => { this.phShown = 0; });
      this.$watch('view', () => { this.$nextTick(() => { const el = document.querySelector('main'); if (el) el.scrollTop = 0; if (this.view === 'chat') this.scrollThread(); }); });
    },
    go(v) { if (location.hash.slice(1) === v) { this.view = v; this.admin = v.startsWith('admin-'); this.nav = false; } else location.hash = v; },
    syncTheme() { const a = document.documentElement.dataset.theme; this.isDark = a ? a === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; },
    toggleTheme() { const next = this.isDark ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('theme', next); } catch (e) {} this.syncTheme(); setTimeout(refreshCharts, 30); },

    toasts: [], tid: 0,
    toast(m) { const id = ++this.tid; this.toasts.push({ id, m }); setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 2600); },
    pill(s) {
      if (['Connected','Ready for Analysis','Operational','Active','Healthy','Success'].includes(s)) return 'p-good';
      if (['Importing','Processing','Validating','Uploading','Connecting','Pending','Invited'].includes(s)) return 'p-info';

      return 'p-mute';
    },
    cell(v, c) { return c.fmt === '$' ? '$' + Number(v).toLocaleString() : c.fmt === '%' ? v + '%' : c.num ? Number(v).toLocaleString() : v; },
    hl(sql) {
      return sql.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

        .replace(/\b(SELECT|FROM|JOIN|LEFT|ON|WHERE|GROUP BY|ORDER BY|LIMIT|AS|SUM|COUNT|AVG|DATE_TRUNC|AND|BETWEEN|DESC|ASC|INTERVAL|EXTRACT|NULLIF|ROUND|COALESCE|IN|HAVING)\b/g, '<span class="kw">$1</span>')

      { id:'c1', name:'Trade Orders', type:'PostgreSQL 16', host:'db.tradecorp.example', status:'Connected', tables:23, checked:'2 min ago', refreshed:'Today 01:12' },
